name: Native Cloud OS Live Boot
on:
  repository_dispatch:
    types: [launch_os]

permissions:
  contents: write

jobs:
  run-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Virtualization, Display, and Tracking Tools
        run: |
          # Replaced netstat-pn with the correct package bundle identifier net-tools
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 novnc websockify curl jq xdotool net-tools

      - name: Download AxelOS ISO to Cloud Disk
        run: |
          curl -L -o custom-os.iso "https://archive.org/download/axelos-amd64/axelos-amd64.iso"
          
      - name: Boot Debian KDE with Software Emulation
        run: |
          qemu-system-x86_64 \
            -m 5120 \
            -smp 2 \
            -boot d \
            -cdrom custom-os.iso \
            -vnc :0 \
            -vga std \
            -display none \
            -daemonize

      - name: Customize and Start noVNC Web Interface
        run: |
          sudo sed -i 's/noVNC/AxelOS Live Sandbox/g' /usr/share/novnc/vnc.html
          echo "body { background: #0b0f19 !important; }" | sudo tee -a /usr/share/novnc/app/styles/base.css > /dev/null
          nohup websockify --web /usr/share/novnc/ 8080 localhost:5900 > websockify.log 2>&1 &
          sleep 3

      - name: Start Localhost.run Tunnel & Export Dynamic URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Allocate an unbuffered stream channel by using a background terminal pipe process
          ssh -tt -R 80:localhost:8080 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nokey@localhost.run > tunnel.log 2>&1 &
          
          echo "Waiting for localhost.run edge servers to allocate routing lane..."
          
          # ULTRA-PRECISE LOG STREAMER & PARSER
          # Loops up to 60 seconds, checking the log file every 2 seconds for a unique live link address
          LIVE_URL=""
          for i in {1..30}; do
            sleep 2
            
            # FIXED FILTER: Explicitly blocks 'admin' and ensures it searches strictly for lines containing 'lhr.life' or dynamic tunnel links
            LIVE_URL=$(grep -oE "https://[a-zA-Z0-9.-]+" tunnel.log | grep -E "(\.lhr\.life|\.lhrtunnel\.link)" | grep -v "admin" | head -n 1)
            
            if [ ! -z "$LIVE_URL" ]; then
              echo "Real public tunnel path located successfully: $LIVE_URL"
              break
            fi
            echo "Waiting for connection handshake... ($((i * 2))s elapsed)"
          done
          
          if [ -z "$LIVE_URL" ]; then
            echo "CRITICAL FAULT: Tunnel generation timed out or failed to extract link."
            echo "Dumping raw terminal log data content:"
            cat tunnel.log
            exit 1
          fi
          
          # Strip out trailing spaces or hidden newline characters from the output variable
          CLEAN_URL=$(echo "$LIVE_URL" | tr -d '[:space:]')
          
          echo "=========================================================="
          echo "VALIDATED PATH POINTER: ${CLEAN_URL}"
          echo "COMMENCING EDGE ROUTING HANDSHAKE VERIFICATION..."
          echo "=========================================================="
          
          # WEB INTEGRITY VERIFICATION LOOP
          # Forces the runner to poll the real HTTP link until it stops throwing errors or empty responses
          for j in {1..20}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${CLEAN_URL}/vnc.html" || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "404" ] || [ "$HTTP_STATUS" = "405" ]; then
              echo "Edge routing lane confirmed active with HTTP Status Code: ${HTTP_STATUS}"
              break
            fi
            echo "Gateway signaling latency detected (HTTP ${HTTP_STATUS}). Re-verifying node mapping in 3s... ($((j * 3))s)"
            sleep 3
          done
          
          # Print log cache directly into the main execution console frame
          cat tunnel.log
          
          # Overwrite session.json only after the link is physically verified as working
          echo "{\"status\": \"ready\", \"url\": \"${CLEAN_URL}?autoconnect=true&resize=scale\"}" > session.json
          
          # Commit the working ready flag back to the repository data matrix tracking
          git config --global user.name "AxelOS-Launcher-Bot"
          git config --global user.email "actions@github.com"
          git add session.json
          git commit -m "System ready for verification check [skip ci]" || true
          git push


      - name: Live Activity Monitor & Auto-Shutdown Daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "====================================================="
          echo "STARTING DISTROSEA ACTIVITY MONITORING DAEMON..."
          echo "====================================================="
          
          # Initialize baseline activity markers
          IDLE_TIME=0
          CONNECTED_ONCE=false
          
          while true; do
            sleep 10
            
            # Check if a user browser is physically connected to the websockify port (8080)
            CONNECTION_COUNT=$(netstat -an | grep 8080 | grep ESTABLISHED | wc -l)
            
            if [ "$CONNECTION_COUNT" -gt 0 ]; then
              if [ "$CONNECTED_ONCE" = "false" ]; then
                echo "User entry detected! Locking session into active parameters."
                CONNECTED_ONCE=true
                
                # Update status profile to active so Vercel locks out duplicate launches safely
                echo "{\"status\": \"active\", \"url\": \"\"}" > session.json
                git add session.json
                git commit -m "User connected. Queue path locked [skip ci]" || true
                git push
              fi
              
              # Reset idle timer because user is actively connected
              IDLE_TIME=0
            else
              # If someone was connected but dropped out (tab closed), shut down immediately!
              if [ "$CONNECTED_ONCE" = "true" ]; then
                echo "User closed tab window connection. Triggering shutdown pipeline sequence..."
                break
              fi
              
              # FALLBACK TIMEOUT: If nobody connects within 3 minutes of boot up, drop the server
              IDLE_TIME=$((IDLE_TIME + 10))
              if [ "$IDLE_TIME" -ge 180 ]; then
                echo "No user claimed the reservation window within 3 minutes. Clearing slot..."
                break
              fi
            fi
            
            # HARD CAP SAFETY FALLBACK: Force shutdown at 4 hours max
            if [ "$SECONDS" -ge 14400 ]; then
              echo "Session reached maximum runtime block limit."
              break
            fi
          done
          
          # SHUTDOWN PROCESSOR: Wipe the repository state database completely clean
          echo "Wiping token cache mappings and shifting back to offline status..."
          echo "{\"status\": \"offline\", \"url\": \"\"}" > session.json
          git add session.json
          git commit -m "Session destroyed. Moving to next queue slot [skip ci]" || true
          git push
