name: Native Cloud OS Live Boot
on:
  repository_dispatch:
    types: [launch_os]

permissions:
  contents: write

jobs:
  run-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Virtualization and Display Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 novnc websockify curl jq

      - name: Download AxelOS to Local Machine Workspace
        run: |
          # Pulls your exact 8GB+ ISO directly into the cloud server pipeline
          curl -L -o custom-os.iso "https://archive.org/download/axelos-amd64/axelos-amd64.iso"

      - name: Boot Debian KDE with Software Emulation
        run: |
          # Replaced -nographic with -display none to fix the -daemonize conflict
          qemu-system-x86_64 \
            -m 5120 \
            -smp 2 \
            -boot d \
            -cdrom custom-os.iso \
            -vnc :0 \
            -vga std \
            -display none \
            -daemonize


      - name: Customize and Start noVNC Web Interface
        run: |
          # Added sudo to bypass the temporary file write permission denied crash
          sudo sed -i 's/noVNC/AxelOS Live Sandbox/g' /usr/share/novnc/vnc.html
          echo "body { background: #0b0f19 !important; }" | sudo tee -a /usr/share/novnc/app/styles/base.css > /dev/null
          
          # Force websockify to run explicitly detached using system nohup redirection
          nohup websockify --web /usr/share/novnc/ 8080 localhost:5900 > websockify.log 2>&1 &
          sleep 3

      - name: Start Localhost.run Tunnel & Export Dynamic URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Added StrictHostKeyChecking=no and forced pseudo-terminal allocation with -tt
          ssh -tt -R 80:localhost:8080 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nokey@localhost.run > tunnel.log 2>&1 &
          sleep 15
          
          # Upgraded regex parser loop to catch any variations of the assigned tunnel link address string
          LIVE_URL=$(grep -oE "https://[a-zA-Z0-9.-]+" tunnel.log | grep -E "(lhrtunnel|lhr.life|localhost)" | head -n 1)
          
          if [ -z "$LIVE_URL" ]; then
            echo "----------------------------------------"
            echo "CRITICAL: Tunnel generation timed out."
            echo "Dumping raw terminal logs for verification analytics:"
            cat tunnel.log
            echo "----------------------------------------"
            exit 1
          fi
          
          # Clean up text strings if trailing spaces or invisible line breaks slip into variables
          CLEAN_URL=$(echo "$LIVE_URL" | tr -d '[:space:]')
          
          # Instantly update state parameters database to ready for the frontend trigger loop
          echo "{\"status\": \"ready\", \"url\": \"${CLEAN_URL}?autoconnect=true&resize=scale\"}" > session.json
          
          git config --global user.name "AxelOS-Launcher-Bot"
          git config --global user.email "actions@github.com"
          git add session.json
          git commit -m "System ready for verification check [skip ci]" || true
          git push


      - name: Session Active Watcher
        run: |
          # Keep the instance listening for 2 full execution hours
          sleep 7200
          
          # Wipe state file parameters clean upon graceful shutdown exit
          echo "{\"status\": \"offline\", \"url\": \"\"}" > session.json
          git config --global user.name "AxelOS-Launcher-Bot"
          git config --global user.email "actions@github.com"
          git add session.json
          git commit -m "Session destroyed [skip ci]" || true
          git push
