name: AxelOS Cloud Desktop

on:
  repository_dispatch:
    types:
      - launch_os

permissions:
  contents: write

concurrency:
  group: axelos-cloud-session
  cancel-in-progress: false

env:
  AXELOS_INACTIVITY_SECONDS: "900"
  AXELOS_CLAIM_TIMEOUT_SECONDS: "180"
  AXELOS_DISCONNECT_GRACE_SECONDS: "60"
  AXELOS_MAX_RUNTIME_SECONDS: "14400"

  CLOUDFLARED_VERSION: "2026.7.3"

  VM_MEMORY: "4096"
  VM_CPUS: "2"

jobs:
  run-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout AxelOS
        uses: actions/checkout@v4


      # ==========================================================
      # INSTALL
      # ==========================================================

      - name: Install Runtime
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            python3 \
            python3-pip \
            curl \
            jq \
            iproute2 \
            ca-certificates

          python3 -m pip install \
            --user \
            --break-system-packages \
            "websockify==0.13.0"

          export PATH="$HOME/.local/bin:$PATH"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo ""
          echo "============================================"
          echo "RUNTIME VERSIONS"
          echo "============================================"

          echo "QEMU:"
          qemu-system-x86_64 --version

          echo ""
          echo "websockify:"
          command -v websockify

          python3 -m pip show websockify | \
            grep -E '^(Name|Version):' || true

          echo ""
          echo "noVNC:"
          test -f /usr/share/novnc/vnc.html
          echo "noVNC installation OK"

          echo ""
          echo "============================================"


      # ==========================================================
      # INITIAL SESSION STATE
      # ==========================================================

      - name: Initialize Session
        shell: bash
        run: |
          set -euo pipefail

          SESSION_ID="$(
            python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(18))
          PY
          )"

          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"

          jq -n \
            --arg id "$SESSION_ID" \
            '{
              status: "booting",
              url: "",
              session_id: $id,
              started_at: now | todate
            }' \
            > session.json

          git config user.name \
            "AxelOS-Launcher-Bot"

          git config user.email \
            "actions@github.com"

          git add session.json

          git commit \
            -m "AxelOS session booting [skip ci]" \
            || true

          git push || true


      # ==========================================================
      # DOWNLOAD AXELOS
      # ==========================================================

      - name: Download AxelOS ISO
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading AxelOS..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o custom-os.iso \
            "https://archive.org/download/axelos-amd64/axelos-amd64.iso"

          test -s custom-os.iso

          ls -lh custom-os.iso


      # ==========================================================
      # PREPARE CUSTOM NOVNC
      # ==========================================================

      - name: Build AxelOS noVNC UI
        shell: bash
        run: |
          set -euo pipefail

          NOVNC_DIR="$HOME/axelos-novnc"

          rm -rf "$NOVNC_DIR"

          mkdir -p "$NOVNC_DIR"

          cp -a \
            /usr/share/novnc/. \
            "$NOVNC_DIR/"

          if [ -f axelos.css ]; then
            cp axelos.css \
              "$NOVNC_DIR/axelos.css"
          fi

          if [ -f axelos-ui.js ]; then
            cp axelos-ui.js \
              "$NOVNC_DIR/axelos-ui.js"
          fi

          curl -fL \
            --max-time 15 \
            -o "$NOVNC_DIR/axelos-favicon.ico" \
            "https://www.axelos.run.place/favicon.ico" \
            || true

          python3 - "$NOVNC_DIR/vnc.html" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          html = html.replace(
              "<title>noVNC</title>",
              "<title>AxelOS Cloud Desktop</title>"
          )

          if "axelos.css" not in html:
              html = html.replace(
                  "</head>",
                  '<link rel="stylesheet" href="axelos.css">\n</head>',
                  1
              )

          if "axelos-ui.js" not in html:
              html = html.replace(
                  "</body>",
                  '<script src="axelos-ui.js"></script>\n</body>',
                  1
              )

          if "axelos-favicon.ico" not in html:
              html = html.replace(
                  "</head>",
                  '<link rel="icon" href="axelos-favicon.ico">\n</head>',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          PY

          echo "Custom AxelOS noVNC prepared."


      # ==========================================================
      # START QEMU
      # ==========================================================

      - name: Start AxelOS VM
        shell: bash
        run: |
          set -euo pipefail

          QEMU_ACCEL_ARGS=()

          if [ -e /dev/kvm ] && \
             [ -r /dev/kvm ] && \
             [ -w /dev/kvm ]; then

            echo "Testing KVM..."

            if timeout 5 \
              qemu-system-x86_64 \
                -accel kvm \
                -machine type=pc \
                -nodefaults \
                -display none \
                -S \
                >/tmp/kvm-test.log 2>&1; then

              echo "KVM available."

              QEMU_ACCEL_ARGS=(
                -accel
                kvm
              )

            else

              echo "KVM unavailable."

              cat /tmp/kvm-test.log || true

            fi
          fi

          echo "Starting QEMU..."

          qemu-system-x86_64 \
            "${QEMU_ACCEL_ARGS[@]}" \
            -machine type=pc \
            -m "${VM_MEMORY}" \
            -smp "${VM_CPUS}" \
            -boot d \
            -cdrom custom-os.iso \
            -vnc 127.0.0.1:0 \
            -vga std \
            -display none \
            -monitor none \
            -daemonize \
            -pidfile qemu.pid

          sleep 5

          test -f qemu.pid

          QEMU_PID="$(cat qemu.pid)"

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "QEMU exited."

            exit 1
          fi

          echo "QEMU PID: $QEMU_PID"

          for i in {1..30}; do
            if ss -ltn | grep -q ':5900 '; then
              echo "VNC ready."
              break
            fi

            sleep 1
          done

          if ! ss -ltn | grep -q ':5900 '; then
            echo "VNC failed to start."

            exit 1
          fi


      # ==========================================================
      # START AXELOS WEBSOCKET GATEWAY
      # ==========================================================

      - name: Start AxelOS WebSocket Gateway
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/axelos-connections

          mkdir -p \
            /tmp/axelos-connections

          rm -f \
            /tmp/axelos-last-activity

          date +%s \
            > /tmp/axelos-last-activity

          AXELOS_WEB_ROOT="$HOME/axelos-novnc"

          export AXELOS_WEB_ROOT

          nohup \
            python3 axelos_proxy.py \
            > axelos-proxy.log \
            2>&1 &

          PROXY_PID="$!"

          echo "$PROXY_PID" \
            > websockify.pid

          sleep 4

          if ! kill -0 "$PROXY_PID" 2>/dev/null; then
            echo "AxelOS proxy failed."

            cat axelos-proxy.log || true

            exit 1
          fi

          if ! ss -ltn | grep -q ':8080 '; then
            echo "Proxy did not bind port 8080."

            cat axelos-proxy.log || true

            exit 1
          fi

          echo "AxelOS proxy ready."


      # ==========================================================
      # INSTALL CLOUDFLARED
      # ==========================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"

          test -s cloudflared.deb

          sudo dpkg -i cloudflared.deb

          echo "cloudflared:"
          cloudflared --version


      # ==========================================================
      # CLOUDFLARE QUICK TUNNEL
      # ==========================================================

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$HOME/.cloudflared"

          if [ -f "$HOME/.cloudflared/config.yml" ]; then
            mv \
              "$HOME/.cloudflared/config.yml" \
              "$HOME/.cloudflared/config.yml.disabled"
          fi

          if [ -f "$HOME/.cloudflared/config.yaml" ]; then
            mv \
              "$HOME/.cloudflared/config.yaml" \
              "$HOME/.cloudflared/config.yaml.disabled"
          fi

          echo "Starting Cloudflare Quick Tunnel..."

          nohup \
            cloudflared tunnel \
              --url http://127.0.0.1:8080 \
            > cloudflared.log \
            2>&1 &

          CLOUDFLARED_PID="$!"

          echo "$CLOUDFLARED_PID" \
            > cloudflared.pid

          TUNNEL_URL=""

          for i in {1..60}; do
            sleep 2

            TUNNEL_URL="$(
              grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                cloudflared.log \
                | head -n 1 \
                || true
            )"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            if ! kill -0 \
              "$CLOUDFLARED_PID" \
              2>/dev/null; then

              echo "cloudflared exited."

              cat cloudflared.log || true

              exit 1
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Cloudflare URL not detected."

            cat cloudflared.log || true

            exit 1
          fi

          # IMPORTANT:
          # This must be a single shell assignment.
          VNC_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale"

          echo "TUNNEL_URL=$TUNNEL_URL" \
            >> "$GITHUB_ENV"

          echo "VNC_URL=$VNC_URL" \
            >> "$GITHUB_ENV"

          echo ""
          echo "============================================"
          echo "AXELOS CLOUD DESKTOP READY"
          echo "============================================"
          echo "Tunnel:"
          echo "$TUNNEL_URL"
          echo ""
          echo "Desktop:"
          echo "$VNC_URL"
          echo "============================================"
          echo ""

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # AxelOS Cloud Desktop

          ## Session Ready

          **Status:** Ready

          **Desktop:** [$VNC_URL]($VNC_URL)

          **Inactivity timeout:** ${AXELOS_INACTIVITY_SECONDS}s

          **Maximum runtime:** ${AXELOS_MAX_RUNTIME_SECONDS}s
          EOF

          jq -n \
            --arg id "$SESSION_ID" \
            --arg url "$VNC_URL" \
            '{
              status: "ready",
              url: $url,
              session_id: $id,
              started_at: now | todate
            }' \
            > session.json

          git config user.name \
            "AxelOS-Launcher-Bot"

          git config user.email \
            "actions@github.com"

          git add session.json

          git commit \
            -m "AxelOS desktop ready [skip ci]" \
            || true

          git push || true


      # ==========================================================
      # LIVE SESSION MONITOR
      # ==========================================================

      - name: Monitor AxelOS Session
        shell: bash
        run: |
          set -u

          START_TIME="$(date +%s)"

          CLAIM_TIMEOUT="${AXELOS_CLAIM_TIMEOUT_SECONDS}"
          INACTIVITY_TIMEOUT="${AXELOS_INACTIVITY_SECONDS}"
          DISCONNECT_GRACE="${AXELOS_DISCONNECT_GRACE_SECONDS}"
          MAX_RUNTIME="${AXELOS_MAX_RUNTIME_SECONDS}"

          CLAIMED=false
          DISCONNECTED_AT=0

          echo "============================================"
          echo "AXELOS SESSION MONITOR"
          echo "============================================"

          echo "Inactivity timeout: ${INACTIVITY_TIMEOUT}s"
          echo "Claim timeout: ${CLAIM_TIMEOUT}s"
          echo "Disconnect grace: ${DISCONNECT_GRACE}s"
          echo "Maximum runtime: ${MAX_RUNTIME}s"

          while true; do

            sleep 10

            NOW="$(date +%s)"

            ELAPSED=$((NOW - START_TIME))

            # --------------------------------------------------
            # MAXIMUM RUNTIME
            # --------------------------------------------------

            if [ "$ELAPSED" -ge "$MAX_RUNTIME" ]; then
              echo "Maximum runtime reached."
              break
            fi


            # --------------------------------------------------
            # QEMU HEALTH
            # --------------------------------------------------

            if [ -f qemu.pid ]; then

              QEMU_PID="$(cat qemu.pid)"

              if ! kill -0 "$QEMU_PID" 2>/dev/null; then
                echo "QEMU stopped."
                break
              fi

            else

              echo "QEMU PID missing."
              break

            fi


            # --------------------------------------------------
            # PROXY HEALTH
            # --------------------------------------------------

            if [ -f websockify.pid ]; then

              PROXY_PID="$(cat websockify.pid)"

              if ! kill -0 "$PROXY_PID" 2>/dev/null; then
                echo "AxelOS proxy stopped."
                break
              fi

            else

              echo "Proxy PID missing."
              break

            fi


            # --------------------------------------------------
            # CLOUDFLARED HEALTH
            # --------------------------------------------------

            if [ -f cloudflared.pid ]; then

              CLOUDFLARED_PID="$(cat cloudflared.pid)"

              if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
                echo "cloudflared stopped."
                break
              fi

            else

              echo "cloudflared PID missing."
              break

            fi


            # --------------------------------------------------
            # CONNECTION STATE
            # --------------------------------------------------

            CONNECTION_COUNT="$(
              find \
                /tmp/axelos-connections \
                -type f \
                2>/dev/null |
              wc -l
            )"

            CONNECTION_COUNT="$(
              echo "$CONNECTION_COUNT" |
              tr -d ' '
            )"


            # --------------------------------------------------
            # USER CONNECTED
            # --------------------------------------------------

            if [ "$CONNECTION_COUNT" -gt 0 ]; then

              DISCONNECTED_AT=0

              if [ "$CLAIMED" = "false" ]; then

                CLAIMED=true

                echo ""
                echo "============================================"
                echo "AXELOS SESSION CLAIMED"
                echo "============================================"

                jq -n \
                  --arg id "$SESSION_ID" \
                  --arg url "$VNC_URL" \
                  '{
                    status: "active",
                    url: $url,
                    session_id: $id
                  }' \
                  > session.json

                git config user.name \
                  "AxelOS-Launcher-Bot"

                git config user.email \
                  "actions@github.com"

                git add session.json

                git commit \
                  -m "AxelOS session active [skip ci]" \
                  || true

                git push || true

              fi


            else

              # ------------------------------------------------
              # USER HAS NOT CONNECTED YET
              # ------------------------------------------------

              if [ "$CLAIMED" = "false" ]; then

                if [ "$ELAPSED" -ge "$CLAIM_TIMEOUT" ]; then

                  echo ""
                  echo "No user claimed the session."
                  echo "Claim timeout reached."

                  break

                fi


              else

                # ----------------------------------------------
                # USER DISCONNECTED
                # ----------------------------------------------

                if [ "$DISCONNECTED_AT" -eq 0 ]; then

                  DISCONNECTED_AT="$NOW"

                  echo "User disconnected."

                fi

                DISCONNECTED_FOR=$(
                  (
                    NOW="$NOW"
                    DISCONNECTED_AT="$DISCONNECTED_AT"

                    echo $((NOW - DISCONNECTED_AT))
                  )
                )

                if [ "$DISCONNECTED_FOR" -ge "$DISCONNECT_GRACE" ]; then

                  echo ""
                  echo "Disconnect grace expired."

                  break

                fi

              fi

            fi


            # --------------------------------------------------
            # ACTUAL USER ACTIVITY
            # --------------------------------------------------

            if [ -f /tmp/axelos-last-activity ]; then

              LAST_ACTIVITY="$(cat /tmp/axelos-last-activity 2>/dev/null || true)"

              LAST_ACTIVITY_INT="${LAST_ACTIVITY%%.*}"

              if [[ "$LAST_ACTIVITY_INT" =~ ^[0-9]+$ ]]; then

                INACTIVE=$((NOW - LAST_ACTIVITY_INT))

              else

                INACTIVE="$ELAPSED"

              fi

            else

              INACTIVE="$ELAPSED"

            fi


            echo \
              "runtime=${ELAPSED}s connections=${CONNECTION_COUNT} inactivity=${INACTIVE}s"


            # --------------------------------------------------
            # INACTIVITY SHUTDOWN
            # --------------------------------------------------

            if [ "$CLAIMED" = "true" ] && \
               [ "$INACTIVE" -ge "$INACTIVITY_TIMEOUT" ]; then

              echo ""
              echo "============================================"
              echo "AXELOS INACTIVITY LIMIT REACHED"
              echo "============================================"

              echo \
                "No keyboard/mouse/clipboard activity for ${INACTIVE}s."

              break

            fi

          done


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Shutdown AxelOS
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================"
          echo "SHUTTING DOWN AXELOS"
          echo "============================================"


          # ------------------------------------------------------
          # CLOUDFLARED
          # ------------------------------------------------------

          if [ -f cloudflared.pid ]; then

            PID="$(cat cloudflared.pid)"

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping cloudflared..."
              kill "$PID" 2>/dev/null || true
            fi

          fi


          # ------------------------------------------------------
          # WEBSOCKET PROXY
          # ------------------------------------------------------

          if [ -f websockify.pid ]; then

            PID="$(cat websockify.pid)"

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping AxelOS proxy..."
              kill "$PID" 2>/dev/null || true
            fi

          fi


          # ------------------------------------------------------
          # QEMU
          # ------------------------------------------------------

          if [ -f qemu.pid ]; then

            PID="$(cat qemu.pid)"

            if kill -0 "$PID" 2>/dev/null; then

              echo "Stopping QEMU..."

              kill "$PID" 2>/dev/null || true

              sleep 3

              if kill -0 "$PID" 2>/dev/null; then
                kill -9 "$PID" 2>/dev/null || true
              fi

            fi

          fi


          # ------------------------------------------------------
          # OFFLINE STATE
          # ------------------------------------------------------

          cat > session.json <<'EOF'
          {
            "status": "offline",
            "url": "",
            "session_id": ""
          }
          EOF


          git config user.name \
            "AxelOS-Launcher-Bot"

          git config user.email \
            "actions@github.com"


          git add session.json

          git commit \
            -m "AxelOS session offline [skip ci]" \
            || true

          git push || true


          echo ""
          echo "============================================"
          echo "AXELOS SHUTDOWN COMPLETE"
          echo "============================================"
