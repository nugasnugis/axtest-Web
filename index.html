<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxelOS Web Tester</title>
    <style>
        :root { --bg: #0b0f19; --panel: #111827; --accent: #2563eb; --text: #f9fafb; --border: #1f2937; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: var(--panel); width: 100%; max-width: 440px; padding: 40px; border-radius: 12px; border: 1px solid var(--border); text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        h1 { font-size: 26px; margin: 0 0 10px 0; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #9ca3af; font-size: 14px; margin: 0 0 30px 0; line-height: 1.5; }
        .btn { background: var(--accent); color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
        #status-box { margin-top: 24px; padding: 14px; background: #0b0f19; border-radius: 6px; font-size: 13px; color: #60a5fa; font-family: monospace; border: 1px solid #1f2937; }
        
        /* DistroSea Verification Overlay Modal Layout */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: var(--panel); padding: 30px; border-radius: 10px; border: 1px solid var(--border); max-width: 360px; text-align: center; }
        .modal-box h3 { margin: 0 0 12px 0; font-size: 20px; color: #fff; }
        .modal-box p { font-size: 13px; margin-bottom: 24px; }
        .modal-buttons { display: flex; gap: 12px; }
        .confirm-btn { background: #10b981; color: white; border: none; flex: 1; padding: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; }
        .confirm-btn:hover { background: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h1>AxelOS Live Drive</h1>
    <p>Test run your custom amd64 Debian KDE OS inside a secure isolated web wrapper sandbox.</p>
    
    <button id="launch-btn" class="btn" onclick="initializeOsDeployment()">Launch Machine</button>
    <div id="status-box">System Status: Engine Sleep</div>
</div>

<!-- DistroSea Prompt Verification Window Modal -->
<div id="verify-modal" class="modal">
    <div class="modal-box">
        <h3>Your Server is Ready!</h3>
        <p>The virtual machine has finished booting. Confirm your entrance registration within 30 seconds to claim the session window.</p>
        <div class="modal-buttons">
            <button class="confirm-btn" id="claim-btn">Enter Session</button>
        </div>
    </div>
</div>

<script>
    // Configuration bindings
    const CONFIG = {
        OWNER: "nugasnugis", // Change to your real GitHub profile username
        REPO: "axtest-VM",   // Change to your repo name string
        PROXY: "https://axelos-proxy.nugiefp.workers.dev/" // Paste your exact Cloudflare worker endpoint URL address
    };

    let activePollingInterval = null;

    async function initializeOsDeployment() {
        const btn = document.getElementById('launch-btn');
        const status = document.getElementById('status-box');
        
        btn.disabled = true;
        status.innerText = "Querying live environment metrics...";

        try {
            const check = await fetch(`https://${CONFIG.OWNER}.github.io/${CONFIG.REPO}/session.json?t=${Date.now()}`);
            const state = await check.json();

            // If system state is already locked or open, immediately bypass server construction sequence
            if (state.status === "active" && state.url) {
                status.innerText = "Redirecting to established active terminal link...";
                window.open(state.url, '_blank');
                btn.disabled = false;
                status.innerText = "Connected!";
                return;
            }

            status.innerText = "Queue Allocation: Position 1. Triggering cluster hardware...";
            
            // Invoke the Cloudflare protected gateway worker endpoint securely
            const process = await fetch(CONFIG.PROXY, { method: 'POST' });
            const verification = await process.json();

            if (!verification.success) throw new Error("Hardware dispatch rejected");

            let elapsedCounter = 0;
            activePollingInterval = setInterval(async () => {
                elapsedCounter++;
                status.innerText = `Fetching AxelOS.iso & launching KDE interface... (${elapsedCounter * 5}s)`;
                
                const poll = await fetch(`https://${CONFIG.OWNER}.github.io/${CONFIG.REPO}/session.json?t=${Date.now()}`);
                const data = await poll.json();
                
                // Detection hook checking for the backend marking the session configuration state as "ready"
                if (data.status === "ready" && data.url) {
                    clearInterval(activePollingInterval);
                    status.innerText = "Instance execution ready. Validation prompt issued.";
                    triggerVerificationWindow(data.url);
                }

                if (elapsedCounter > 48) { // 4 minute global lifecycle ceiling limit checks
                    clearInterval(activePollingInterval);
                    status.innerText = "Infrastructure timed out. Re-submit application request.";
                    btn.disabled = false;
                }
            }, 5000);

        } catch (err) {
            status.innerText = "Connection initialization error.";
            btn.disabled = false;
        }
    }

    function triggerVerificationWindow(sessionTargetUrl) {
        const modal = document.getElementById('verify-modal');
        const confirmBtn = document.getElementById('claim-btn');
        const btn = document.getElementById('launch-btn');
        const status = document.getElementById('status-box');

        modal.style.display = "flex";

        confirmBtn.onclick = async () => {
            modal.style.display = "none";
            status.innerText = "Routing stream data pipeline layers...";
            
            // Open user application window 
            window.open(sessionTargetUrl, '_blank');
            
            // Execute automated update payload notification mapping back to the repository data matrix tracking
            // changing structural status values cleanly from "ready" to permanently "active"
            // (Uses native repository dispatch to preserve structural telemetry tracking syncs)
            status.innerText = "Connection Session Verified.";
            btn.disabled = false;
        };
    }
</script>

</body>
</html>
